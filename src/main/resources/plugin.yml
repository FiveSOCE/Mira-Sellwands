name: MiraSellWands
version: 0.1.2
main: gg.mira.sellwands.MiraSellWandsPlugin
api-version: '1.21'
author: FiveSOCE
description: Transaction-safe MiraShop container sell wands for the Mira ecosystem.
depend: [MiraCore, Vault, MiraShop]
softdepend: [MiraCosmetics]
commands:
  sellwand:
    description: Sell wand administration
    usage: /sellwand give <player> <uses|-1> [multiplier]
    permission: mirasellwands.admin
permissions:
  mirasellwands.use: {default: true}
  mirasellwands.admin: {default: op}
