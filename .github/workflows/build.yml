name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'
      - name: Build
        run: gradle clean build --stacktrace
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: MiraSellWands-0.1.3
          path: build/libs/MiraSellWands-0.1.3.jar
          if-no-files-found: error

      - name: Publish v0.1.3 release if missing
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v0.1.3 >/dev/null 2>&1; then
            gh release create v0.1.3 \
              build/libs/MiraSellWands-0.1.3.jar \
              --target "${{ github.sha }}" \
              --title "MiraSellWands v0.1.3" \
              --notes "Formalizes SellWand charges into configurable BASIC, ADVANCED and UNLIMITED tiers while preserving numeric custom-wand admin creation and consuming charges only after successful transactional sales."
          fi
